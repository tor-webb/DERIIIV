name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Repo name = sub-path on GitHub Pages (https://<user>.github.io/DERIIIV/)
  PUBLIC_BASE: DERIIIV

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --strict-peer-deps

      - name: Build
        env:
          NODE_ENV: production
          REF_NAME: ${{ github.ref_name }}
          TRANSLATIONS_CDN_URL: ${{ vars.TRANSLATIONS_CDN_URL }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
        run: |
          npm run build --workspace=@deriv/components
          npm run build --workspace=@deriv/reports -- "$PUBLIC_BASE"
          npm run build --workspace=@deriv/trader -- "$PUBLIC_BASE"
          npm run build --workspace=@deriv/core -- "$PUBLIC_BASE"

      - name: Add SPA fallback for GitHub Pages
        run: |
          cd packages/core/dist
          # GitHub Pages serves 404.html for unknown paths; reuse the app shell so deep links work
          cp index.html 404.html
          touch .nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/core/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
