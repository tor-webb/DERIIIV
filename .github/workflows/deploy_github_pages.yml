name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Landing page lives at https://<user>.github.io/DERIIIV/ and the trading app at .../DERIIIV/app/
  PUBLIC_BASE: DERIIIV/app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --strict-peer-deps

      - name: Build
        env:
          NODE_ENV: production
          REF_NAME: ${{ github.ref_name }}
          TRANSLATIONS_CDN_URL: ${{ vars.TRANSLATIONS_CDN_URL }}
          # Public OAuth client ID; a repository secret named OAUTH_CLIENT_ID overrides it if you add one
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID || '34LokBezOF2aG5dSubeIL' }}
        run: |
          npm run build --workspace=@deriv/components
          npm run build --workspace=@deriv/reports -- "$PUBLIC_BASE"
          npm run build --workspace=@deriv/trader -- "$PUBLIC_BASE"
          npm run build --workspace=@deriv/core -- "$PUBLIC_BASE"

      - name: Assemble site (landing page + app)
        run: |
          mkdir -p site
          cp landing/index.html site/index.html
          cp landing/service-worker.js site/service-worker.js
          cp -r packages/core/dist site/app
          # GitHub Pages serves 404.html for unknown paths; reuse the app shell so deep links work
          cp site/app/index.html site/404.html
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
